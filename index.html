<style>
:root{
  color-scheme:dark;
  --bg:#04050A; --ink:#ECE8DF; --mute:#9A9CAE; --line:rgba(236,232,223,.16);
  --panel:rgba(5,6,13,.64); --acc:#B4A5FF;
  --f-body:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-num:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

.top{position:fixed;left:0;right:0;top:0;padding:calc(14px + var(--sat)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:3}
.brand{display:flex;align-items:baseline;gap:8px;pointer-events:auto}
.brand b{font-family:var(--f-num);font-weight:400;font-size:34px;line-height:1;color:var(--ink)}
.brand span{font-size:14px;color:var(--mute);letter-spacing:.08em}
.ctrl{display:flex;gap:8px;pointer-events:auto}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .2s,color .2s}
.btn:hover{border-color:var(--acc);color:#fff}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}

#cap{position:fixed;left:16px;bottom:calc(16px + var(--sab));width:min(430px,calc(100vw - 88px));padding:16px 18px 18px;background:var(--panel);border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:2;transition:opacity .35s}
#cap .eb{display:flex;gap:10px;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--mute)}
#cap .eb i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:background .6s,box-shadow .6s}
#cap .eb .rn{color:var(--acc);transition:color .6s}
#cap h2{margin:8px 0 6px;font-size:26px;font-weight:700;line-height:1.25;text-wrap:balance}
#cap p{margin:0;font-size:15.5px;line-height:1.72;color:#d9d6ce;max-width:34em}
#cap .fade{transition:opacity .22s}
#cap.swap .fade{opacity:0}

#readout{transition:opacity .5s;position:fixed;right:58px;bottom:calc(18px + var(--sab));text-align:right;z-index:2;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#readout .pow{font-family:var(--f-num);font-size:58px;line-height:.9;letter-spacing:-.01em}
#readout .pow sup{font-size:.5em;vertical-align:.9em;margin-left:2px}
#readout .pow small{font-family:var(--f-body);font-size:15px;color:var(--mute);margin-left:6px}
#readout .hm{font-size:14px;color:#d9d6ce;margin-top:6px}
#bar{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:10px}
#bar i{display:block;height:6px;border:1px solid rgba(236,232,223,.8);border-top:0}
#bar span{font-family:var(--f-mono);font-size:11px;color:var(--mute)}

#ruler{position:fixed;right:14px;top:calc(72px + var(--sat));bottom:calc(20px + var(--sab));width:30px;z-index:2}
#ruler .ax{position:absolute;left:14px;top:0;bottom:0;width:1px;background:var(--line)}
#ruler .tk{position:absolute;left:10px;width:9px;height:1px;background:rgba(236,232,223,.22)}
#ruler .tk.mj{left:6px;width:17px;background:rgba(236,232,223,.4)}
#ruler .tl{position:absolute;right:26px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10px;color:var(--mute);white-space:nowrap}
#ruler .st{position:absolute;left:9px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;border:1px solid rgba(236,232,223,.45);background:var(--bg);padding:0;cursor:pointer}
#ruler .st:hover,#ruler .st.on{border-color:var(--acc);background:var(--acc)}
#ruler .st::after{content:attr(data-n);position:absolute;right:18px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--f-body);font-size:13px;background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .15s}
#ruler .st:hover::after,#ruler .st:focus-visible::after{opacity:1}
#ruler .cur{position:absolute;left:0;width:30px;height:2px;margin-top:-1px;background:var(--acc);box-shadow:0 0 8px var(--acc);pointer-events:none;transition:background .6s}

#intro,#end{position:fixed;inset:0;z-index:5;display:flex;align-items:center;padding-inline:16px;background:radial-gradient(120% 90% at 0% 50%,rgba(4,5,10,.92) 0%,rgba(4,5,10,.7) 45%,rgba(4,5,10,.05) 80%);transition:opacity .7s}
#intro.gone,#end.gone{opacity:0;pointer-events:none}
.in{max-width:560px;margin-left:clamp(0px,7vw,120px);padding-block:24px}
.kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--acc);margin:0 0 18px}
.in h1{margin:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-weight:400}
.in h1 b{font-family:var(--f-num);font-weight:400;font-size:clamp(110px,22vw,210px);line-height:.78;letter-spacing:-.03em}
.in h1 span{font-size:clamp(28px,5vw,44px);font-weight:700}
.in .lede{font-size:17.5px;line-height:1.8;color:#d9d6ce;margin:26px 0 0;max-width:30em}
.in .lede em{font-style:normal;color:var(--ink);border-bottom:1px solid var(--acc)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:13px 22px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s}
.go:hover{background:#fff;transform:translateY(-1px)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:3px;padding:12px 20px;font-size:16px;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.hint{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);margin-top:18px;letter-spacing:.03em;line-height:1.7}

@media (max-width:640px){
  #readout{right:auto;left:16px;bottom:auto;top:calc(58px + var(--sat));text-align:left}
  #readout .pow{font-size:40px}
  #bar{align-items:flex-start}
  #cap{width:calc(100vw - 80px);padding:13px 14px 14px}
  #cap h2{font-size:21px}
  #cap p{font-size:14px;line-height:1.65}
  #ruler{width:26px;right:10px}
  #ruler .tl{display:none}
  #ruler .st::after{display:none}
  .btn{padding:7px 9px;font-size:11px}
  .brand b{font-size:28px}
  .in{padding-right:34px}
}
@media (max-width:640px){#brandT{display:none}}
.shot .top,.shot #ruler,.shot #intro,.shot #end,.shot #readout .hm,.shot #bar,.shot #cap .eb,.shot #cap p{display:none!important}
.shot #cap{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;left:22px;bottom:16px;width:auto}
.shot #cap h2{margin:0;font-size:30px;text-shadow:0 1px 12px rgba(0,0,0,.9)}
.shot #readout{left:auto;top:auto;right:22px;bottom:14px;text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// ㉔ 質子內部：三個夸克與膠子
layer({name:'proton',lo:-15.6,hi:-14.25,f:.35,
 init(){this.r=rng(161);this.sea=[]},
 draw(a,t){const Rp=.84e-15*P;ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Rp*1.15);g.addColorStop(0,'rgba(255,90,110,.1)');g.addColorStop(.72,'rgba(255,90,110,.14)');g.addColorStop(.8,'rgba(255,130,150,.22)');g.addColorStop(1,'rgba(255,90,110,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,Rp*1.15,0,TAU);ctx.fill();
  const tt=REDUCE?t*.2:t,Q=[0,1,2].map(i=>{const th=i/3*TAU+tt*.25,rr=.34e-15*(1+.18*Math.sin(tt*1.7+i*2));return[Math.cos(th)*rr+Math.sin(tt*2.3+i)*.06e-15,Math.sin(th)*rr+Math.cos(tt*1.9+i*1.7)*.06e-15]});
  const J=[(Q[0][0]+Q[1][0]+Q[2][0])/3,(Q[0][1]+Q[1][1]+Q[2][1])/3];
  const perms=[[0,1,2],[1,0,2],[1,2,0],[2,1,0],[2,0,1],[0,2,1]],COL=['255,77,94','77,255,138','77,139,255'],ph=tt/1.8,pi=Math.floor(ph)%6,fr=ph-Math.floor(ph),flash=Math.max(0,1-fr*5);const pm=perms[pi];
  // gluon flux tubes (Y-shaped string)
  for(let i=0;i<3;i++){const q=Q[i],dx=q[0]-J[0],dy=q[1]-J[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
   for(const[w,al]of[[.09e-15,.12],[.035e-15,.45]]){ctx.globalAlpha=a*al;ctx.strokeStyle='#ffe9b0';ctx.lineWidth=Math.max(w*P,1);ctx.beginPath();for(let s=0;s<=40;s++){const f=s/40,amp=.03e-15*Math.sin(f*Math.PI),wv=Math.sin(f*22-tt*9+i)*amp;const x=J[0]+dx*f+nx*wv,y=J[1]+dy*f+ny*wv;s?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke()}}
  if(flash>0)dg(glow('255,240,200'),X(J[0]),Y(J[1]),.25e-15*P,a*flash*.6);

  this.sea=this.sea.filter(s=>t-s.b<.8);for(const s of this.sea){const age=(t-s.b)/.8,sep=Math.sin(age*Math.PI)*.07e-15,al=Math.sin(age*Math.PI)*.55;for(const sg of[1,-1])dg(glow(s.c),X(s.x+Math.cos(s.a)*sep*sg),Y(s.y+Math.sin(s.a)*sep*sg),Math.max(.035e-15*P,2),a*al)}
  // valence quarks
  const lab=['u','u','d'],ch=['+⅔','+⅔','−⅓'];
  for(let i=0;i<3;i++){const q=Q[i],sx=X(q[0]),sy=Y(q[1]),c=COL[pm[i]];dg(glow(c),sx,sy,Math.max(.2e-15*P,8),a);dg(glow('255,255,255'),sx,sy,Math.max(.05e-15*P,3),a);
   const la=a*sstep(-14.55,-14.75,z);txt(sx,sy-Math.max(.15e-15*P,10)-10,lab[i],la,20,'#fff');txt(sx,sy+Math.max(.15e-15*P,10)+10,ch[i],la*.8,12,`rgb(${c})`)}}});

// ───────── stops (captions + tour) ─────────
const STOPS=[
 [27.05,'universe','可觀測宇宙','直徑約 930 億光年。每一個光點都是一整個星系，估計有數千億個，它們排成一張巨大的網。最外圈是宇宙微波背景：我們能看到最古老的光，出發於 138 億年前。',
  'The observable universe','93 billion light-years across. Each dot is a whole galaxy, and there are hundreds of billions of them, strung into a web. The glowing rim is the oldest light we can see. It set out 13.8 billion years ago.'],
 [25.0,'laniakea','拉尼亞凱亞超星系團','名字是夏威夷語，意思是「無垠的天堂」。約十萬個星系像河流一樣，慢慢流向同一個地方：巨引源。銀河系就在它的外圍。',
  'Laniakea Supercluster','Hawaiian for "immeasurable heaven". About 100,000 galaxies drift like rivers towards one place, the Great Attractor. The Milky Way sits out near the edge.'],
 [22.85,'local-group','本星系群','銀河系和仙女座星系是這一帶的兩個老大，身邊跟著幾十個矮星系。仙女座在 250 萬光年外，天氣好的晚上用肉眼就看得到。你看到的那道光出發時，現代人類還要再等兩百多萬年才會出現。',
  'The Local Group','Two big spirals, the Milky Way and Andromeda, and dozens of dwarf galaxies. Andromeda is visible to the naked eye. The light you\'d see left it 2.5 million years ago, long before modern humans.'],
 [21.1,'milky-way','銀河系','直徑約 10 萬光年，有上千億顆恆星。中心是一個 400 萬倍太陽質量的黑洞。太陽在獵戶臂上，離中心約 2.6 萬光年，繞一圈要 2 億多年。',
  'The Milky Way','100,000 light-years across, with more than a hundred billion stars and a black hole of 4 million Suns at the centre. The Sun is 26,000 light-years out. One lap takes it over 200 million years.'],
 [19.5,'bright-stars','夜空的亮星','你叫得出名字的亮星，大多離我們不到兩千光年。這張圖的方向照赤經排，距離是真的。北極星約 430 光年：今晚你看到的北極星光，是明朝時出發的。',
  'The stars you can name','Most of the bright stars you know are within 2,000 light-years. Distances here are real; directions follow right ascension. The light from Polaris you see tonight set out in the 1590s, while Shakespeare was writing his first plays.'],
 [17.7,'nearest-stars','最近的恆星','比鄰星離我們 4.24 光年，是太陽以外最近的恆星。牛郎星在 16.7 光年外，織女星在 25 光年外，兩顆星彼此相隔約 15 光年。七夕的鵲橋，光也要走 15 年。',
  'The nearest stars','Proxima Centauri is the closest star after the Sun, 4.24 light-years away. In the Chinese Qixi legend, Altair and Vega are lovers who meet once a year on a bridge of magpies. Light takes 15 years to cross it.'],
 [16.55,'oort-cloud','歐特雲','太陽系最外圍，一大群冰冷的彗星胚胎包成一顆球，外緣估計在 10 萬天文單位左右（1 天文單位是地球到太陽的距離）。航海家 1 號要再飛大約 300 年，才會碰到它的內緣。',
  'The Oort cloud','A shell of icy bodies around the whole solar system, reaching perhaps 100,000 AU out (1 AU is the distance from Earth to the Sun). Voyager 1 needs about 300 more years just to reach its inner edge.'],
 [13.85,'heliosphere','太陽風的泡泡','太陽吹出的帶電粒子，在周圍撐出一個巨大的泡泡，叫日球層。1977 年出發的航海家 1 號在 2012 年穿了出去。2026 年 11 月前後，它離地球將滿一光日：無線電訊號要跑整整 24 小時才追得上它。',
  'The Sun\'s bubble','The solar wind blows a bubble around us called the heliosphere. Voyager 1, launched in 1977, left it in 2012. Around November 2026 it will be one light-day from Earth, so a radio signal takes a full 24 hours to reach it.'],
 [12.75,'giant-planets','巨行星','木星、土星、天王星、海王星。這些行星的位置，是用你打開這一頁的日期算出來的，它們此刻就在這裡。行星的大小有放大，不然會看不見。',
  'The giant planets','Jupiter, Saturn, Uranus and Neptune, placed where they are on the day you opened this page. Their sizes are enlarged, or you wouldn\'t see them.'],
 [11.5,'earth-orbit','地球的軌道','地球每秒跑 30 公里，繞著太陽轉。光從太陽到地球要 8 分 20 秒，所以你感覺到的陽光，其實是 8 分鐘前的太陽。',
  'Earth\'s orbit','Earth covers 30 km every second. Sunlight takes 8 minutes 20 seconds to get here, so the Sun you feel on your skin is the Sun of eight minutes ago.'],
 [9.0,'moon','地球與月球',()=>`月球平均離我們 38 萬公里。月球在遠地點時，太陽系其他七顆行星可以肩並肩排進這段空隙，圖上照比例畫了出來。今天的月相是${phaseName}，約 ${Math.round(illum*100)}% 被照亮。`,
  'Earth and the Moon',()=>`The Moon is about 384,000 km away on average. At its farthest, the other seven planets fit side by side in the gap, drawn here to scale. Today it\'s a ${phaseEn} Moon, ${Math.round(illum*100)}% lit.`],
 [7.3,'earth','地球',()=>`明暗交界線是照此刻的時間畫的，臺灣現在是${tpDay?'白天':'晚上'}。人類的整部歷史，都發生在這顆直徑 12,742 公里的球上。`,
  'Earth',()=>`The line between day and night is drawn for this moment. It\'s ${tpDay?'daytime':'night'} in Taiwan right now. All of human history happened on this ball, 12,742 km across.`],
 [6.0,'taiwan','臺灣','南北長約 394 公里，北回歸線從中間穿過。中央山脈縱貫全島，玉山 3,952 公尺，比富士山還高。',
  'Taiwan','About 394 km from north to south, with the Tropic of Cancer running through the middle. Its highest peak, Yushan, is 3,952 m, taller than Mount Fuji.'],
 [4.35,'taipei','臺北盆地','三面環山，淡水河和基隆河從盆地流過，大臺北住著大約 700 萬人。（街道是示意圖，不是真實地圖）',
  'The Taipei Basin','Mountains on three sides and two rivers through the middle. About 7 million people live in greater Taipei. (The streets are illustrative, not a real map.)'],
 [2.6,'park','大安森林公園','臺北市中心的一片樹林，約 26 公頃。晚上躺在草地上，抬頭就是剛才那片宇宙。',
  'Daan Forest Park','26 hectares of trees in the middle of Taipei. Lie on the grass at night and the universe you just flew through is right above you.'],
 [.45,'you','你','你在這裡。宇宙最大的尺度在你上方 27 個數量級，最小的在你下方 15 個。接下來，我們往你的手指裡面走。',
  'You','You are here. The largest scale in the universe is 27 orders of magnitude above you, and the smallest we can see is 15 below. Next, into your fingertip.'],
 [-1.75,'fingerprint','指紋','每道紋路間距約半公釐，紋路會斷開、分岔，這些細節讓每個人的指紋都不同。你還在媽媽肚子裡時，指紋就定型了，連同卵雙胞胎都不一樣。',
  'Fingerprint','The ridges are about half a millimetre apart. They break and fork in a pattern that is yours alone, and it was set before you were born. Even identical twins don\'t share one.'],
 [-3.3,'skin','皮膚表面','最外層是一片片死掉的扁平細胞，像屋瓦一樣疊著。那些小洞是汗腺的出口。你每分鐘大約掉下三到四萬個皮膚細胞。',
  'The surface of your skin','The top layer is dead, flattened cells, overlapping like roof tiles. The holes are sweat pores. You shed roughly 30,000 to 40,000 skin cells a minute.'],
 [-4.75,'cell','活細胞','潛到表皮底層，這裡的細胞還活著。藍色是細胞核，紅色是粒線體，負責產生能量。你身上大約有 37 兆個細胞。（顏色仿照螢光顯微鏡）',
  'A living cell','Deeper in the skin, the cells are alive. Blue is the nucleus, and the red shapes are mitochondria, which make the cell\'s energy. You have about 37 trillion cells. (Colours follow fluorescence microscopy.)'],
 [-5.9,'chromatin','細胞核裡','這些纏在一起的線是 DNA。一個細胞裡的 DNA 拉直約 2 公尺，卻收在直徑約 6 微米的細胞核裡，就像把 24 公里長、比頭髮還細的絲線塞進一顆網球。',
  'Inside the nucleus','These tangled threads are DNA. Stretched out, one cell\'s DNA is 2 metres long, packed into a nucleus 6 micrometres wide. Picture 24 km of thread, finer than a hair, stuffed into a tennis ball.'],
 [-7.05,'nucleosome','核小體','DNA 在一團組蛋白上繞將近兩圈，一顆接一顆，像一串珠子。細胞就是這樣把 2 公尺長的 DNA 收整齊的。',
  'Nucleosomes','DNA wraps almost twice around a spool of histone proteins, then moves on to the next, like beads on a string. This is how a cell keeps 2 metres of DNA tidy.'],
 [-8.25,'dna','DNA 雙螺旋','A 配 T，C 配 G。兩股之間有一寬一窄的溝。你的一套 DNA 約有 30 億個字母，一秒念一個，不吃不睡要念將近 100 年。',
  'The double helix','A pairs with T, C with G. The two strands leave one wide groove and one narrow. Your genome has about 3 billion letters. Reading one a second without sleep would take nearly 100 years.'],
 [-9.25,'atoms','原子','這是鳥嘌呤（G）的一部分。灰色是碳，藍色是氮，紅色是氧，白色是氫。除了氫，組成你的原子幾乎都是在恆星裡煉出來的。你是星塵做的。',
  'Atoms','Part of a guanine (G) base. Grey is carbon, blue nitrogen, red oxygen, white hydrogen. Apart from the hydrogen, almost every atom in you was made inside a star. You are made of stardust.'],
 [-9.95,'carbon','碳原子','原子沒有清楚的邊界。電子不是繞圈的小球，而是一團機率雲：畫面上每一次閃爍，都是電子可能出現的位置，每一幀重新抽樣。',
  'A carbon atom','An atom has no sharp edge. Electrons aren\'t little balls on orbits; they\'re a cloud of probability. Each flicker is a place an electron could be, sampled fresh every frame.'],
 [-12.0,'void','空','我們已經在原子內部。如果原子有一座體育場那麼大，原子核只是正中央的一顆豌豆。你、我、鑽石、鋼鐵，裡面幾乎都是空的。',
  'Empty','We\'re inside the atom now. If an atom were a stadium, its nucleus would be a pea in the middle. You, diamonds and steel are almost entirely empty space.'],
 [-14.1,'nucleus','原子核','6 個質子和 6 個中子，原子 99.9% 以上的質量都擠在這裡。一茶匙這種密度的物質，重約 10 億噸，中子星就是這麼重。',
  'The nucleus','Six protons and six neutrons carry more than 99.9% of the atom\'s mass. A teaspoon of matter this dense would weigh about a billion tonnes. That\'s what a neutron star is made of.'],
 [-14.8,'proton','質子內部','三個夸克被膠子綁在一起，永遠拉不開。夸克本身只占質子質量的 1% 左右，其餘來自它們的運動和膠子的能量：E = mc²。再往下 20 個數量級是普朗克長度，物理學還不知道那裡長什麼樣子。',
  'Inside a proton','Three quarks, held by gluons, that can never be pulled apart. Their own mass is about 1% of the proton\'s. The rest is energy, E = mc². Twenty orders of magnitude further down is the Planck length, and physics can\'t yet say what it looks like.']
].map(([z,id,t,b,te,be])=>({z,id,t,b,te,be}));
const REALMS=[[20.3,'宇宙','Cosmos','#B4A5FF'],[15.3,'恆星','Stars','#F6C979'],[10.2,'太陽系','Solar system','#FFA566'],[-.7,'地球','Earth','#62D6C4'],[-9.05,'生命','Life','#FF8BA7'],[-99,'原子','Atoms','#7ADFFF']];
const realmOf=v=>REALMS.find(r=>v>=r[0]);
const ZMAX=27.35,ZMIN=-15.05;

// ───────── UI ─────────
const $=id=>document.getElementById(id);
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(c=>SUP[c]||c).join('');
function cnum(n){const f=v=>{const s=v>=100?Math.round(v).toLocaleString():v>=10?(Math.round(v*10)/10).toString():(Math.round(v*100)/100).toString();return s};
  if(n>=1e12)return f(n/1e12)+' 兆';if(n>=1e8)return f(n/1e8)+' 億';if(n>=1e4)return f(n/1e4)+' 萬';return f(n)}
function numEn(n){const f=v=>v>=100?Math.round(v).toLocaleString('en'):v>=10?String(Math.round(v*10)/10):String(Math.round(v*100)/100);if(n>=1e12)return f(n/1e12)+' trillion';if(n>=1e9)return f(n/1e9)+' billion';if(n>=1e6)return f(n/1e6)+' million';return f(n)}
function human(m){const en=LANG==='en',o=(v,zh,e)=>{if(en)return numEn(v)+' '+e;const s=cnum(v);return s+(/[萬億兆]$/.test(s)?'':' ')+zh};
  if(m>=.05*LY)return o(m/LY,'光年','light-years');if(m>=.05*AU)return o(m/AU,'天文單位','AU');if(m>=1e3)return o(m/1e3,'公里','km');if(m>=1)return o(m,'公尺','m');if(m>=.01)return o(m*100,'公分','cm');if(m>=1e-3)return o(m*1e3,'公釐','mm');
  if(m>=1e-6)return o(m*1e6,'微米','µm');if(m>=1e-9)return o(m*1e9,'奈米','nm');if(m>=1e-12)return o(m*1e12,'皮米','pm');return o(m*1e15,'飛米','fm')}
const ruler=$('ruler'),cur=$('cur');let RH=1;const zToY=v=>(ZMAX-v)/(ZMAX-ZMIN)*RH;
function buildRuler(){RH=ruler.clientHeight;[...ruler.querySelectorAll('.tk,.tl,.st')].forEach(e=>e.remove());
  for(let v=Math.ceil(ZMIN);v<=Math.floor(ZMAX);v++){const t=document.createElement('div');t.className='tk'+(v%5===0?' mj':'');t.style.top=zToY(v)+'px';ruler.appendChild(t);
   if(v%5===0){const l=document.createElement('div');l.className='tl';l.textContent='10'+sup(v);l.style.top=zToY(v)+'px';ruler.appendChild(l)}}
  STOPS.forEach((s,i)=>{const b=document.createElement('button');b.className='st';b.type='button';b.dataset.n=tr(s.t,s.te);b.setAttribute('aria-label',tr('前往：','Go to: ')+tr(s.t,s.te));b.style.top=zToY(s.z)+'px';b.onclick=e=>{e.stopPropagation();stopTour();flyTo(s.z)};ruler.appendChild(b);s.el=b})}
ruler.addEventListener('click',e=>{const r=ruler.getBoundingClientRect();stopTour();flyTo(clamp(ZMAX-(e.clientY-r.top)/RH*(ZMAX-ZMIN),ZMIN,ZMAX))});

let capI=-1,capTimer=0;
function updCaption(){let bi=0,bd=1e9;STOPS.forEach((s,i)=>{const d=Math.abs(z-s.z);if(d<bd){bd=d;bi=i}});
  if(bi!==capI){const first=capI<0;capI=bi;const s=STOPS[bi];STOPS.forEach((q,i)=>q.el&&q.el.classList.toggle('on',i===bi));
   const cap=$('cap');cap.classList.add('swap');clearTimeout(capTimer);capTimer=setTimeout(()=>{const b=tr(s.b,s.be);$('ttl').textContent=tr(s.t,s.te);$('txt').textContent=typeof b==='function'?b():b;cap.classList.remove('swap')},first?0:220);if(!first)chime()}}
let lastRealm='';
function updHUD(){const e=Math.round(z);$('exp').textContent=(e<0?'−':'')+Math.abs(e);$('hm').textContent=tr('畫面寬約 ','Screen width ≈ ')+human(Math.pow(10,z)*W/D);
  const rl=realmOf(z);if(rl[1]!==lastRealm){lastRealm=rl[1];$('realm').textContent=tr(rl[1],rl[2]);document.documentElement.style.setProperty('--acc',rl[3])}
  $('capz').textContent='10'+sup(e)+' m';
  const mpp=Math.pow(10,z)/D,raw=(W<640?80:110)*mpp,ex=Math.floor(Math.log10(raw)),bs=raw/Math.pow(10,ex),nice=bs<1.5?1:bs<3.5?2:bs<7.5?5:10,val=nice*Math.pow(10,ex);$('barI').style.width=(val/mpp).toFixed(1)+'px';$('barS').textContent=human(val);
  cur.style.top=zToY(z)+'px';updCaption()}

// ───────── audio ─────────
let AC=null,OSC=[],MG=null,sndOn=false;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.Q.value=.7;lp.connect(MG);
  const dl=AC.createDelay(1.5);dl.delayTime.value=.38;const fb=AC.createGain();fb.gain.value=.38;dl.connect(fb);fb.connect(dl);dl.connect(MG);
  MG.connect(AC.destination);const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=260;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  for(const[type,det,g]of[['sine',0,.34],['sine',702,.16],['triangle',-7,.07],['sine',1200,.05],['sine',1905,.02]]){const o=AC.createOscillator(),gg=AC.createGain();o.type=type;o.detune.value=det;gg.gain.value=g;o.connect(gg);gg.connect(lp);o.start();OSC.push(o)}
  AC.dly=dl}catch(e){AC=null}}
function droneF(){return 62*Math.pow(2,(ZMAX-z)/(ZMAX-ZMIN)*3.1)}
function chime(){if(!AC||!sndOn)return;const t=AC.currentTime,base=droneF()*4,notes=[0,2,4,7,9];const f=base*Math.pow(2,notes[(Math.random()*5)|0]/12);
  for(const[m,g]of[[1,.09],[2.01,.025]]){const o=AC.createOscillator(),e=AC.createGain();o.type='sine';o.frequency.value=f*m;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+2.4);o.connect(e);e.connect(MG);e.connect(AC.dly);o.start(t);o.stop(t+2.5)}}
function setSound(on){sndOn=on;if(on){audioInit();if(AC){AC.resume();MG.gain.setTargetAtTime(.55,AC.currentTime,.4)}}else if(AC)MG.gain.setTargetAtTime(0,AC.currentTime,.2);
  $('bSnd').setAttribute('aria-pressed',on);sndLabel()}
function sndLabel(){$('bSnd').textContent=tr('聲音：'+(sndOn?'開':'關'),'Sound: '+(sndOn?'on':'off'))}
$('bSnd').onclick=()=>setSound(!sndOn);

// ───────── navigation, flights, tour ─────────
let flight=null,tour=null,paused=false;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(v,dur){flight={from:z,to:v,t:0,dur:dur||Math.min(5,.7+.55*Math.abs(v-z))}}
function tourLabel(){$('bTour').textContent=tour?tr('❚❚ 暫停導覽','❚❚ Pause tour'):tr('▶ 自動導覽','▶ Guided tour')}
function stopTour(){if(tour){tour=null;tourLabel()}flight=null}
function startTour(i){hideIntro();$('end').classList.add('gone');tour={i:i||0,ph:'fly',t:0};flyTo(STOPS[tour.i].z,.9+.6*Math.abs(STOPS[tour.i].z-z));tourLabel()}
function dwellOf(s){const b0=tr(s.b,s.be),b=typeof b0==='function'?b0():b0;return LANG==='en'?clamp(2+b.length*.032,4,9):clamp(2.2+b.length*.05,4,8.5)}
function tourStep(dt){if(!tour)return;if(tour.ph==='fly'){if(!flight){tour.ph='dwell';tour.t=0}}else{tour.t+=dt;if(tour.t>=dwellOf(STOPS[tour.i])){tour.i++;if(tour.i>=STOPS.length){stopTour();$('end').classList.remove('gone');return}tour.ph='fly';flyTo(STOPS[tour.i].z,.9+.6*Math.abs(STOPS[tour.i].z-z))}}}
$('bTour').onclick=()=>{if(tour){stopTour()}else{let i=STOPS.findIndex(s=>s.z<z-.05);if(i<0||z>=ZMAX-.1)i=0;startTour(i)}};
function hideIntro(){$('intro').classList.add('gone');$('cap').style.opacity='';$('readout').style.opacity=''}
$('cap').style.opacity='0';$('readout').style.opacity='0';
$('bStart').onclick=()=>{setSound(true);startTour(0)};
$('bSelf').onclick=()=>{hideIntro();flyTo(STOPS[0].z,1.2)};
$('bAgain').onclick=()=>{$('end').classList.add('gone');z=zT=ZMAX;startTour(0)};
$('bYou').onclick=()=>{$('end').classList.add('gone');flyTo(.45,4)};
$('bFree').onclick=()=>$('end').classList.add('gone');
function nudge(dz){hideIntro();stopTour();zT=clamp(zT+dz,ZMIN,ZMAX)}
addEventListener('wheel',e=>{e.preventDefault();const m=e.deltaMode===1?30:e.deltaMode===2?600:1;nudge(e.deltaY*m*(e.ctrlKey?.012:.0016))},{passive:false});
const PT=new Map();let pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);PT.set(e.pointerId,[e.clientX,e.clientY]);if(PT.size===2){const[a,b]=[...PT.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{if(!PT.has(e.pointerId))return;const p=PT.get(e.pointerId);if(PT.size===1)nudge((e.clientY-p[1])*.008);PT.set(e.pointerId,[e.clientX,e.clientY]);
  if(PT.size===2){const[a,b]=[...PT.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch>0&&d>0)nudge(-Math.log10(d/pinch));pinch=d}});
const up=e=>{PT.delete(e.pointerId);pinch=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  const next=dir=>{hideIntro();stopTour();const s=dir>0?STOPS.find(s=>s.z<z-.08):[...STOPS].reverse().find(s=>s.z>z+.08);if(s)flyTo(s.z)};
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key==='ArrowRight'){e.preventDefault();next(1)}else if(e.key==='ArrowUp'||e.key==='PageUp'||e.key==='ArrowLeft'){e.preventDefault();next(-1)}
  else if(e.key===' '){e.preventDefault();$('bTour').click()}else if(e.key==='+'||e.key==='='){nudge(-.2)}else if(e.key==='-'){nudge(.2)}});

// ───────── main loop ─────────
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';D=Math.min(W,H);cx=W/2;cy=H/2;buildRuler()}
addEventListener('resize',resize);
function centerMark(){const rl=realmOf(z);ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.4;ctx.strokeStyle=rl[3];ctx.lineWidth=1;ctx.beginPath();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){ctx.moveTo(cx+dx*9,cy+dy*9);ctx.lineTo(cx+dx*15,cy+dy*15)}ctx.stroke();ctx.restore()}
let last=performance.now(),initQ=[...LAYERS],RDY=false;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  for(let k=0;k<(SHOT?99:3)&&initQ.length;k++){const L=initQ.shift();try{L.init&&L.init()}catch(e){console.error(L.name,e)}L.ready=true}
  if(!initQ.length&&!RDY){RDY=true;(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>{window.__ready=true},300))}
  if(flight){flight.t+=dt;const k=Math.min(1,flight.t/flight.dur);z=zT=lerp(flight.from,flight.to,ease(k));if(k>=1)flight=null}
  else z+=(zT-z)*(1-Math.exp(-dt*7));
  tourStep(dt);
  if(AC&&sndOn)for(const o of OSC)o.frequency.setTargetAtTime(droneF(),AC.currentTime,.3);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#04050A';ctx.fillRect(0,0,W,H);
  P=D/Math.pow(10,z);
  for(const L of LAYERS){if(!L.ready)continue;const a=sstep(L.lo,L.lo+L.f,z)*(1-sstep(L.hi-L.f,L.hi,z));if(a<.004)continue;ctx.save();try{L.draw(a,T)}catch(e){if(!L.err){console.error(L.name,e);L.err=1}}ctx.restore()}
  centerMark();updHUD();requestAnimationFrame(frame)}
const I18N={
 brandT:['個數量級','orders of magnitude'],h1s:['個數量級','orders of magnitude'],unitM:['公尺','m'],
 kick1:['從宇宙邊緣，一路縮小到質子裡面','From the edge of the universe to the inside of a proton'],
 lede1:['可觀測宇宙的直徑約 8.8 × 10<sup>26</sup> 公尺，一顆質子約 1.7 × 10<sup>−15</sup> 公尺，兩者相差大約 <em>10<sup>42</sup> 倍</em>。這一頁把中間的每一層都畫了出來，沒有用任何一張照片。行星位置、月相、地球的晝夜，都是依照你打開這一頁的時刻算的。',
  'The observable universe is about 8.8 × 10<sup>26</sup> metres across. A proton is about 1.7 × 10<sup>−15</sup> metres. Between them is a factor of roughly <em>10<sup>42</sup></em>. This page draws every layer in between, without a single photograph. Planet positions, the Moon\'s phase, and day and night on Earth are worked out for the moment you open it.'],
 bStart:['開始旅程','Start the journey'],bSelf:['自己探索','Zoom on my own'],
 hint1:['滾輪、雙指縮放、上下拖曳都能移動<br>↓ ↑ 跳到下一站 / 上一站　空白鍵 暫停導覽','Scroll, pinch, or drag up and down to zoom<br>↓ ↑ next or previous stop · Space starts or pauses the tour'],
 kick2:['旅程結束','Journey complete'],
 lede2:['你剛剛從 930 億光年寬的宇宙，縮小到不到 2 飛米的質子裡。你自己也在這條路上：往上 27 個數量級是宇宙，往下 15 個數量級是質子。',
  'You went from a universe 93 billion light-years wide to the inside of a proton less than 2 femtometres across. You were on the way: the universe is 27 orders of magnitude above you, the proton 15 below.'],
 bAgain:['再飛一次','Fly again'],bYou:['回到你身上','Back to you'],bFree:['自由探索','Look around']};
function applyLang(){const en=LANG==='en';document.documentElement.lang=en?'en':'zh-Hant';document.title=tr('42 個數量級','42 Orders of Magnitude');
  for(const k in I18N){const el=$(k);if(el)el.innerHTML=I18N[k][en?1:0]}
  $('bLang').textContent=tr('EN','中文');$('bLang').setAttribute('aria-label',tr('Switch to English','切換成中文'));
  $('ruler').setAttribute('aria-label',tr('尺度','Scale'));cv.setAttribute('aria-label',tr('從可觀測宇宙縮放到質子內部的互動畫面','Interactive zoom from the observable universe to the inside of a proton'));
  STOPS.forEach(s=>{if(s.el){s.el.dataset.n=tr(s.t,s.te);s.el.setAttribute('aria-label',tr('前往：','Go to: ')+tr(s.t,s.te))}});
  tourLabel();sndLabel();capI=-1;lastRealm='';updHUD()}
$('bLang').onclick=()=>{LANG=LANG==='en'?'zh':'en';try{localStorage.setItem('42-lang',LANG)}catch(e){}applyLang()};
// deep links: #dna, #earth, #proton … (a bare token, so it survives the artifact viewer too)
function fromHash(fly){const h=decodeURIComponent(location.hash.slice(1)).toLowerCase(),s=STOPS.find(s=>s.id===h);if(!s)return false;hideIntro();stopTour();$('end').classList.add('gone');if(fly)flyTo(s.z);else z=zT=s.z;return true}
addEventListener('hashchange',()=>fromHash(true));
resize();applyLang();
if(SHOT){document.documentElement.classList.add('shot');hideIntro();const qz=parseFloat(Q.get('z'));if(!isNaN(qz))z=zT=clamp(qz,ZMIN,ZMAX)}else fromHash(false);
updHUD();requestAnimationFrame(frame);
</script>
